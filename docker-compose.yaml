services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hr_onboarding
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: hr_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_user -d hr_onboarding"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Initialize upload volume permissions for the non-root backend user
  init-uploads:
    image: busybox:1.36
    user: "0:0"
    command: ["sh", "-c", "chown -R 185:0 /uploads && chmod 775 /uploads"]
    volumes:
      - uploads_data:/uploads

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hr_onboarding
      DB_USERNAME: hr_user
      DB_PASSWORD: hr_password
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/work/uploads
    depends_on:
      postgres:
        condition: service_healthy
      init-uploads:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data: