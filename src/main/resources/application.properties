quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:hr_user}
quarkus.datasource.password=${DB_PASSWORD:hr_password}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/hr_onboarding}

quarkus.datasource.devservices.enabled=false

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# OpenAPI
quarkus.smallrye-openapi.info-title=HR Employee Onboarding API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Bulk employee upload and onboarding APIs

# Swagger UI in production container
quarkus.swagger-ui.always-include=true

# Camel REST DSL OpenAPI integration
camel.rest.api-context-path=/openapi
quarkus.camel.openapi.expose.enabled=true

